services:
  backend:
    profiles: ["dev"]
    build: .
    working_dir: /app/backend
    command: ["python", "-m", "uvicorn", "app.main:app", "--reload", "--host", "0.0.0.0", "--port", "58080"]
    ports:
      - "127.0.0.1:58080:58080"
    environment:
      PORT: 58080
      HOST: 0.0.0.0
      PYTHONUNBUFFERED: 1
      HF_ENDPOINT: https://hf-mirror.com
    volumes:
      - ./backend:/app/backend
      - ./backend/.env:/app/backend/.env:ro
      - hwrag_hf_cache:/root/.cache/huggingface

  hwrag:
    profiles: ["prod"]
    build: .
    working_dir: /app/backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PORT: 8000
      HOST: 0.0.0.0
      PYTHONUNBUFFERED: 1
      HF_ENDPOINT: https://hf-mirror.com
      CHROMA_MODE: persistent
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/.env:/app/backend/.env:ro
      - hwrag_hf_cache:/root/.cache/huggingface

volumes:
  hwrag_hf_cache:
