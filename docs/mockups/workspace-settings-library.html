function usageData(){return Array.from({length:usageDays},(_,i)=>{const input=Math.round((13000+(i*7919%36000)+Math.sin(i*1.3)*7000)*(usageScope==='session'?.22:1));return {input,output:Math.round(input*(.2+(i%3)*.04)),cached:Math.round(input*(.35+(i%4)*.1))};});}
function fmt(n){return n>=1e6?(n/1e6).toFixed(2)+'M':n>=1000?(n/1000).toFixed(1)+'K':String(n);}
function chart(data){const W=820,H=220,P=35,innerW=W-P*2,innerH=H-P*2,max=Math.max(...data.map(d=>d.input))*1.1,x=i=>P+i*innerW/(data.length-1),y=v=>H-P-v/max*innerH,colors=['var(--accent)','var(--blue)','#bd9f68'];let out=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${usageDays} 天输入、输出和缓存 Token ${chartMode==='line'?'折线图':'柱状图'}">`;for(let i=0;i<4;i++){const v=max*i/3;out+=`<line x1="${P}" x2="${W-P}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="3 5"/><text x="0" y="${y(v)+3}">${fmt(v)}</text>`;}
['input','output','cached'].forEach((k,j)=>{if(chartMode==='line'){const points=data.map((d,i)=>`${x(i)},${y(d[k])}`).join(' ');if(j===0)out+=`<polygon class="area" points="${P},${H-P} ${points} ${W-P},${H-P}" fill="var(--tint)"/>`;out+=`<polyline points="${points}" fill="none" stroke="${colors[j]}" stroke-width="${j===0?2.5:1.8}" stroke-linejoin="round"/>`;}else{const step=innerW/data.length,bw=Math.max(2,step*.22);out+=data.map((d,i)=>`<rect x="${P+i*step+j*bw}" y="${y(d[k])}" width="${bw-1}" height="${H-P-y(d[k])}" rx="1" fill="${colors[j]}"><title>第 ${i+1} 天 ${k}: ${d[k]}</title></rect>`).join('');}});for(let i=0;i<6;i++){const index=Math.round(i*(data.length-1)/5);out+=`<text x="${x(index)}" y="${H-7}" text-anchor="middle">D${index+1}</text>`;}return out+'</svg>';}
function renderUsage(){const d=usageData(),sum=k=>d.reduce((n,v)=>n+v[k],0),input=sum('input'),output=sum('output'),cached=sum('cached'),total=input+output;return head()+`<div class="toolbar"><div class="segmented">${[7,14,30].map(n=>`<button class="${usageDays===n?'active':''}" data-action="usage-days" data-id="${n}">近 ${n} 天</button>`).join('')}</div><select id="usage-scope" aria-label="用量范围"><option value="all" ${usageScope==='all'?'selected':''}>全部会话</option><option value="session" ${usageScope==='session'?'selected':''}>当前会话 · demo-session-01</option></select><span class="spacer"></span>${badge('示例统计')}${btn(icon('refresh-cw')+'刷新','demo-refresh','sm')}</div><div class="metric-grid">${[['输入 Tokens',input,'含缓存输入'],['未缓存输入',input-cached,'输入减去缓存部分'],['输出 Tokens',output,'模型实际输出'],['总 Tokens',total,'输入 + 输出'],['缓存 Tokens',cached,'输入中的缓存部分'],['缓存命中率',(cached/input*100).toFixed(1)+'%','缓存输入 / 全部输入']].map(([a,b,c])=>`<div class="panel metric"><div class="metric-label">${a}</div><div class="metric-value">${typeof b==='number'?fmt(b):b}</div><div class="metric-sub">${c}</div></div>`).join('')}</div>`+panel('用量趋势',`最近 ${usageDays} 天 · ${usageScope==='session'?'当前会话':'全部会话'}`,chart(d)+`<div class="legend"><span><i style="background:var(--accent)"></i>输入</span><span><i style="background:var(--blue)"></i>输出</span><span><i style="background:#bd9f68"></i>缓存</span></div>`,`<div class="segmented"><button data-action="chart" data-id="line" class="${chartMode==='line'?'active':''}">折线</button><button data-action="chart" data-id="bar" class="${chartMode==='bar'?'active':''}">柱状</button></div>`)+`<div style="height:22px"></div>`+panel('按模型统计','输入、输出、缓存与调用次数',`<div class="table-wrap"><table><thead><tr><th>模型</th><th>输入</th><th>输出</th><th>缓存</th><th>命中率</th><th>总量</th><th>调用次数</th></tr></thead><tbody>${[['gpt-4.1',.72,92],['gpt-4o-mini',.28,58]].map(([m,r,c])=>`<tr><td><span class="mono">${m}</span><div class="usage-progress"><span style="width:${r*100}%"></span></div></td><td>${fmt(Math.round(input*r))}</td><td>${fmt(Math.round(output*r))}</td><td>${fmt(Math.round(cached*r))}</td><td>${(cached/input*100).toFixed(1)}%</td><td>${fmt(Math.round(total*r))}</td><td>${Math.round(c*usageDays/30)}</td></tr>`).join('')}</tbody></table></div>`)+`<div class="section-label">当前会话概况</div><div class="chip-row">${['18 条消息','9 条用户提问','9 条 AI 回答','12 处来源引用','累计耗时 1m 24s','模型 gpt-4.1'].map(x=>badge(x)).join('')}</div>`;}

function renderKnowledge(){let kb=state.kbs.find(k=>k.id===activeKb)||state.kbs[0];if(!kb)return head(btn('新建知识库','kb-add','primary'))+empty('还没有知识库');activeKb=kb.id;const docs=state.docs.filter(d=>d.kb===kb.id),chunks=docs.reduce((n,d)=>n+d.chunks,0);let body='';if(kbTab==='documents')body=`<div class="toolbar"><div class="searchbox">${icon('search')}<input id="doc-search" type="search" placeholder="搜索文档…" aria-label="搜索文档" value="${esc(resourceQuery)}"></div><select id="doc-status" aria-label="索引状态"><option value="all">全部状态</option><option value="indexed">已索引</option><option value="indexing">索引中</option><option value="error">索引失败</option></select><span class="spacer"></span>${btn(icon('refresh-cw')+'刷新','demo-refresh','sm')}</div><section class="panel" id="doc-results">${docRows()}</section><button class="dropzone" id="upload-dropzone" data-action="upload" style="width:100%;margin-top:18px">${icon('upload')}<strong>拖入文档，或点击上传</strong><p>PDF · DOCX · MD · TXT　/　上传前选择分块方式</p></button>`;

else body=panel('检索测试','建议加入一个轻量的检索检查入口',`<div class="note" style="margin-bottom:18px">${icon('info')}这是新增交互设想：仅对示例片段做本地关键词匹配，不运行向量检索或真实模型。</div><form id="retrieval-form"><label class="field"><span class="field-label">测试问题</span><div class="input-row"><input name="query" placeholder="试试“初始化”或“时钟”" required>${btn('开始检索','retrieval-submit','primary','type="submit"')}</div></label></form><div id="retrieval-results"></div>`,idea());
return head(btn(icon('plus')+'新建知识库','kb-add')+btn(icon('upload')+'上传文档','upload','primary'))+`<div class="resource-layout"><aside class="stack"><div class="folder-list" aria-label="知识库目录">${kbFolders()}</div><div class="note">${icon('info')}启用的知识库可以参与检索，当前查看的库与聊天检索范围分开设置。</div></aside><section><div class="kb-top"><div class="kb-icon">${icon('book-open')}</div><div style="min-width:0"><div class="flex wrap"><h2>${esc(kb.name)}</h2>${kb.builtin?badge('内置'):''}${badge(kb.enabled?'已启用':'已停用',kb.enabled?'good':'')}</div><p>${esc(kb.desc)}</p></div><span class="spacer"></span>${toggle('启用知识库','kb-toggle',kb.enabled,kb.id)}${ib('pencil','kb-rename','重命名知识库',`data-id="${kb.id}"`)}</div><div class="kb-inline-stats"><span><strong class="mono">${docs.length}</strong> 份文档</span><span><strong class="mono">${chunks}</strong> 个分块</span><span class="mono">${esc(kb.embedding)}</span><span>默认 ${esc(kb.method)}</span></div><div class="toolbar"><label class="small muted" for="kb-scope">对话检索范围</label><select id="kb-scope" style="max-width:160px"><option>全部启用的知识库</option><option>仅当前知识库</option><option>仅当前文档</option></select><select id="kb-scope-document" style="max-width:180px" aria-label="指定检索文档" hidden>${docs.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select><span class="spacer"></span>${btn(icon('download')+'导出','kb-export','sm')}${btn(icon('upload')+'导入','kb-import','sm')}${!kb.builtin?ib('trash-2','kb-delete','删除知识库',`data-id="${kb.id}"`):''}</div>`+tabs([['documents','文档'],['config','知识库配置'],['retrieval','检索测试 '+idea()]],kbTab,'kb-tab')+body+'</section></div>';}

function translatePreview(){$('.wordmark small').textContent='AGENT';if(state.settings.language!=='en'){const reverse=Object.fromEntries(Object.entries(translations).map(([k,v])=>[v,k]));[$('.workspace'),$('.side-foot'),$('.topbar')].forEach(root=>{const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){const key=n.nodeValue.trim();if(reverse[key])n.nodeValue=n.nodeValue.replace(key,reverse[key]);}});return;}[$('#navigation'),$('.topbar'),$('.workspace'),$('.side-foot'),...(route==='appearance'?[$('#content')]:[])].forEach(root=>{const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){const key=n.nodeValue.trim();if(translations[key])n.nodeValue=n.nodeValue.replace(key,translations[key]);}});}
function openModal(title,body,submitLabel='',formType='',context={}){lastModalFocus=document.activeElement;modalContext={type:formType,...context};const m=$('#modal');m.innerHTML=`<div class="modal-head"><h2 id="modal-title">${title}</h2>${ib('x','modal-close','关闭弹窗')}</div><div class="modal-body">${submitLabel?`<form id="modal-form">${body}<p class="modal-error" id="modal-error" role="alert"></p><div class="modal-foot">${btn('取消','modal-close')}${btn(submitLabel,'modal-submit','primary','type="submit"')}</div></form>`:body}</div>`;if(!m.open)m.showModal();const first=$('input:not([type=hidden]),textarea,select',m);if(first)first.focus();}

case 'kb-export':{const kb=state.kbs.find(k=>k.id===activeKb);const payload={format:'hwrag-static-prototype-v1',knowledgeBase:kb,documents:state.docs.filter(d=>d.kb===kb.id)};download('knowledge-demo.json',JSON.stringify(payload,null,2),'application/json');toast('已导出当前知识库演示清单，不含文档原文件');break;}

case 'doc-toggle':{const d=state.docs.find(d=>d.id===id);d.enabled=!d.enabled;mutated('已更新文档演示启用状态');break;}

function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
document.addEventListener('submit',event=>{event.preventDefault();if(event.target.id==='retrieval-form'){retrieve(new FormData(event.target).get('query'));return;}if(event.target.id!=='modal-form')return;const form=event.target,data=namedForm(form),type=modalContext.type,id=modalContext.id;try{
if(type==='provider'){if(!data.name.trim()||!/^https?:\/\//.test(data.url))throw Error('请填写名称和 HTTP(S) 端点。');const p={id:uid(),name:data.name.trim(),url:data.url,verified:false,models:[]};state.providers.push(p);providerId=p.id;ephemeralSecrets[`provider-${p.id}`]=ephemeralSecrets['new-provider-key']||'';delete ephemeralSecrets['new-provider-key'];settingsTab='providers';}
else if(type==='folder'){if(!data.name.trim())throw Error('请输入收藏夹名称。');if(id)state.folders.find(f=>f.id===id).name=data.name.trim();else {const f={id:uid(),name:data.name.trim()};state.folders.push(f);folder=f.id;}}
else if(type==='folder-move'){if(!data.name.trim())throw Error('请输入收藏夹名称。');const f={id:uid(),name:data.name.trim()};state.folders.push(f);state.bookmarks.find(b=>b.id===id).folder=f.id;}
else if(type==='bookmark'){if(!data.title.trim()||!data.body.trim())throw Error('请填写标题和内容。');state.bookmarks.push({id:uid(),folder:data.folder,title:data.title,body:data.body,tag:data.tag||'未分类',session:'新收藏演示',role:'assistant',date:'2026-11-11',sources:[]});folder=data.folder;}
else if(type==='bookmark-move'){state.bookmarks.find(b=>b.id===id).folder=data.folder;}
else if(type==='memory'){if(!data.content.trim())throw Error('请填写记忆内容。');const m={...data,id:id||uid(),status:'active'};if(id)Object.assign(state.memories.find(m=>m.id===id),m);else state.memories.push(m);}
else if(type==='profile'){['pins','peripherals','sources','rejected'].forEach(k=>JSON.parse(data[k]));if(!data.name.trim())throw Error('请填写档案名称。');if(id)Object.assign(state.profiles.find(p=>p.id===id),data);else state.profiles.push({...data,id:uid()});closeDrawer();}
else if(type==='skill'){if(!data.name.trim()||!data.description.trim()||!data.body.trim())throw Error('请填写技能名称、描述与说明。');state.skills.push({id:uid(),name:data.name,description:data.description,scope:data.scope,enabled:false,compat:'支持',source:'本地创建',content:`---\nname: ${data.name}\ndescription: ${data.description}\n---\n\n${data.body}\n`,resources:[]});}
else if(type==='skill-edit'){const s=state.skills.find(s=>s.id===id);s.content=data.content;s.modified=true;}
else if(type==='skill-enable'){state.skills.find(s=>s.id===id).enabled=true;}
else if(type==='skill-import'){const draft={url:data.url,ref:data.ref,path:data.path,scope:data.scope,adapter:data.adapter==='on'};const hash='demo-fixed-version-001';openModal('候选技能预览',`<div class="note warn">${icon('info')}下面为虚构候选，不是从输入的 GitHub 链接获取。输入地址仅用于演示确认步骤。</div><p class="field-hint" style="margin-top:13px;overflow-wrap:anywhere">来源：${esc(draft.url)}<br>提交：<span class="mono">${hash}</span><br>安装范围：${draft.scope==='project'?'项目':'用户'}${draft.adapter?' · Claude 适配':''}</p><label class="method"><span class="flex"><input name="candidate" type="checkbox" value="demo-skill"><strong class="small">demo-skill</strong><span class="spacer"></span>${badge('支持','good')}</span><p class="field-hint">演示候选技能；默认不勾选，选择后才能安装。</p></label>`,'安装选中技能','skill-install',{draft});$('#modal-form button[type=submit]').disabled=true;return;}
else if(type==='skill-install'){if(!data.candidate)throw Error('请先选择一个候选技能。');const draft=modalContext.draft;state.skills.push({id:uid(),name:'demo-skill',description:'通过候选预览安装的示例技能。',scope:draft.scope,adapter:draft.adapter,enabled:false,compat:'支持',source:'GitHub · 演示固定版本',content:'---\nname: demo-skill\ndescription: Demo skill package.\n---\n\nThis is a simulated import.\n',resources:[]});}
else if(type==='mcp'){const args=JSON.parse(data.args),env=JSON.parse(data.env);if(!Array.isArray(args)||args.some(v=>typeof v!=='string'))throw Error('参数必须是 JSON 字符串数组。');if(!env||Array.isArray(env)||typeof env!=='object'||Object.values(env).some(v=>typeof v!=='string'))throw Error('环境变量必须是 JSON 字符串映射。');if(!/^([A-Za-z]:[\\/]|\/)/.test(data.command))throw Error('请提供程序绝对路径。');const id=uid();ephemeralSecrets['mcp-env-'+id]=data.env;state.mcp.push({id,name:data.name,command:data.command,args:JSON.stringify(args),running:false});}
else if(type==='kb'){if(!data.name.trim()||!data.embedding.trim())throw Error('请填写名称与 Embedding 模型。');const k={id:uid(),name:data.name,desc:data.description,embedding:data.embedding,url:data.url,chunker:data.chunker,chunkerUrl:data.chunkerUrl,context:data.context,method:data.method,size:Number(data.size),enabled:true};state.kbs.push(k);activeKb=k.id;kbTab='documents';}
else if(type==='kb-rename'){if(!data.name.trim())throw Error('请填写知识库名称。');state.kbs.find(k=>k.id===id).name=data.name.trim();}
else if(type==='upload'){if(!data.method)throw Error('请选择分块方式。');const kb=activeKb,newIds=[];pendingFiles.forEach(f=>{const existing=state.docs.find(d=>d.kb===kb&&d.name===f.name);const d={id:existing?.id||uid(),kb,name:f.name,type:f.name.split('.').pop().toUpperCase(),size:Math.max(1,Math.round(f.size/1024))+' KB',chunks:0,status:'indexing',enabled:true,method:data.method,date:'11-11 10:00'};newIds.push(d.id);if(existing)Object.assign(existing,d);else state.docs.push(d);});pendingFiles=[];setTimeout(()=>{state.docs.forEach(d=>{if(newIds.includes(d.id)){d.status='indexed';d.chunks=3;}});persist();if(route==='knowledge')render();toast('演示索引完成 · 每个文件生成 3 个示例分块');},1200);}
closeModal();mutated(type==='upload'?'已加入演示索引队列，未上传文件正文':'已保存到本地演示空间');
}catch(error){$('#modal-error').textContent=error instanceof SyntaxError?'JSON 格式无效，请检查后重试。':error.message;}});
function updateSaveStatus(){const s=$('#save-status');if(s)s.textContent='有未保存的演示修改';}
document.addEventListener('input',event=>{const el=event.target;if(el.dataset.setting){const k=el.dataset.setting;state.settings[k]=el.type==='range'?Number(el.value):el.value;dirty=true;updateSaveStatus();const out=$('#out-'+k);if(out)out.textContent=el.value;if(k==='fontSize'&&$('#font-preview'))$('#font-preview').style.fontSize=el.value+'px';if(k==='longMemory'&&$('#memory-counter'))$('#memory-counter').textContent=el.value.length+' / 4,000 字符';if(k==='systemPrompt'&&$('#prompt-counter'))$('#prompt-counter').textContent=el.value.length+' 字符 · 约 '+Math.ceil(el.value.length/4)+' tokens';}if(el.dataset.secret)ephemeralSecrets[el.dataset.secret]=el.value;if(el.dataset.providerField){const p=state.providers.find(p=>p.id===providerId);p[el.dataset.providerField]=el.value;p.verified=false;dirty=true;updateSaveStatus();}if(el.id==='nav-search'){navFilter=el.value;renderNav();translatePreview();}if(el.id==='bookmark-search'){resourceQuery=el.value;$('#bookmark-results').innerHTML=bookmarkCards();}if(el.id==='doc-search'){resourceQuery=el.value;$('#doc-results').innerHTML=docRows();}if(el.dataset.audit){auditFilters[el.dataset.audit]=el.value;$('#audit-results').innerHTML=auditRows();}if(el.id==='memory-search'||el.id==='memory-project')filterMemory();if(el.id==='skill-search')filterSkills();if(el.id==='profile-search')$$('#profile-results .list-row').forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(el.value.toLowerCase()));if(el.id==='chunk-search')$$('#chunks .chunk').forEach(row=>row.hidden=!row.textContent.includes(el.value));});
function filterMemory(){const search=$('#memory-search')?.value.toLowerCase()||'',scope=$('#memory-scope')?.value||'all',tier=$('#memory-tier')?.value||'all',kind=$('#memory-kind')?.value||'all',status=$('#memory-status')?.value||'all',project=$('#memory-project')?.value||'';const items=state.memories.filter(m=>m.content.toLowerCase().includes(search)&&(scope==='all'||m.scope===scope)&&(tier==='all'||m.tier===tier)&&(kind==='all'||m.kind===kind)&&(status==='all'||m.status===status)&&(m.project||'').includes(project));$('#memory-results').innerHTML=items.map(memoryEntry).join('')||empty('没有匹配的记忆条目','调整筛选条件后重试。');}

async function importCollection(file){if(!file)return;try{if(file.size>2*1024*1024)throw Error('演示清单应小于 2 MB。');const data=JSON.parse(await file.text());if(data.format!=='hwrag-static-prototype-v1'||!Array.isArray(data.documents))throw Error('请选择此原型导出的演示 JSON 清单。');const allowed=['name','type','size','chunks','method','date'];let added=0;for(const d of data.documents){if(typeof d.name!=='string'||!['PDF','DOCX','MD','TXT'].includes(d.type))continue;const doc={id:uid(),kb:activeKb,status:'indexed',enabled:true};allowed.forEach(k=>doc[k]=typeof d[k]==='string'?d[k]:k==='chunks'&&Number.isFinite(d[k])?Math.max(0,d[k]):k==='chunks'?0:'');const existing=state.docs.find(x=>x.kb===activeKb&&x.name===doc.name);if(existing)Object.assign(existing,{...doc,id:existing.id});else{state.docs.push(doc);added++;}}mutated(`已导入演示清单 · 新增 ${added} 个文档条目`);}catch(error){toast(error.message||'读取演示清单失败');}}
