- id: stm32f4-q001
  query: STM32F4 GPIO 端口复位后的默认模式是什么？
  expected_answer: 复位后，GPIO 端口的备用功能未激活，I/O 端口被配置为输入模式（Input mode），对应 GPIOx_MODER 的值为
    00。
