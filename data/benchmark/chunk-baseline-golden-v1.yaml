- id: esp32-q007
  query: ESP32 的 VDD_SDIO 电源域如何配置？MTDI 和 eFuse 如何影响其输出电压？
  expected_answer: VDD_SDIO 由内部 LDO 供电，默认通过 MTDI 在复位时选择：MTDI=0 时 VDD_SDIO 接 1.8V LDO，MTDI=1
    时连接 VDD3P3_RTC。若 EFUSE_SDIO_FORCE=1，则由 EFUSE_SDIO_TIEH 决定：0 接 1.8V，1 接 VDD3P3_RTC。
  source_pdf: data/pdfs/mcu/esp32_datasheet.pdf
