  question_type: table_query
- id: stm32f4-q007
  query: 配置 STM32F4 GPIO 为复用功能，需要设置哪些寄存器，各寄存器的作用是什么？
  expected_answer: 需要先将 GPIOx_MODER 对应位设为 10（Alternate function mode），然后通过 GPIOx_AFRH
    或 GPIOx_AFRL 选择具体的 AF0~AF15 功能；输出类型/速度/上下拉由 OTYPER、OSPEEDR、PUPDR 配置。
  source_pdf: data/pdfs/mcu/stm32f4_gpio_exti_extract.pdf
