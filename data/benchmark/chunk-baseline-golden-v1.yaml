- id: stm32f4-q004
  query: 如何清除 STM32F4 EXTI 挂起寄存器 EXTI_PR 中的 pending bit？
  expected_answer: 向 EXTI_PR 对应位 PRx 写 1 即可清除该 pending bit；该位为 rc_w1 类型，读 0 表示无触发请求，读
    1 表示已发生选定触发请求。
  source_pdf: data/pdfs/mcu/stm32f4_gpio_exti_extract.pdf
