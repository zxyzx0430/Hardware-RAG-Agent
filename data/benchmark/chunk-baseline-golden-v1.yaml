- id: stm32f4-q005
  query: STM32F4 GPIOx_MODER 寄存器中，MODERy[1:0] 取 01、10、11 时分别对应什么 I/O 模式？
  expected_answer: 01 对应 General purpose output mode（通用输出模式），10 对应 Alternate function
    mode（复用功能模式），11 对应 Analog mode（模拟模式）；00 为 Input mode（复位状态）。
  source_pdf: data/pdfs/mcu/stm32f4_gpio_exti_extract.pdf
