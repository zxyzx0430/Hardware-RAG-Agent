  - 12f13dda-4d71-4a4a-9870-fe7e9d7e5062#s0
  question_type: fact_extraction
- id: ch340g-q004
  query: CH340G 的 V3 引脚在 5V 供电时应如何连接？
  expected_answer: 5V 供电时，V3 引脚是内部 3.3V USB 物理层参考，需通过 4.7nF~20nF 的退耦电容接到地；3.3V 供电时才将
    V3 与 VCC 短接。
  source_pdf: data/pdfs/interface/ch340g_datasheet.pdf
