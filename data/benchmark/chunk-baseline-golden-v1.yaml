  - baseline-stm32f4-gpio-exti#s105
  question_type: cross_page
- id: stm32f4-q008
  query: 使用 STM32F4 EXTI 外部中断的完整配置流程是什么？
  expected_answer: 1）通过 SYSCFG_EXTICR1~4 选择 EXTIx 的 GPIO 源；2）配置 EXTI_IMR 使能中断线、EXTI_EMR
    使能事件线；3）配置 EXTI_RTSR/FTSR 选择上升沿/下降沿触发；4）在 NVIC 中使能对应 IRQ；5）中断发生后向 EXTI_PR 对应位写
    1 清除 pending。
  source_pdf: data/pdfs/mcu/stm32f4_gpio_exti_extract.pdf
