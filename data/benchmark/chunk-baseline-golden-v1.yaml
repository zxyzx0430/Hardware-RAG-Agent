- id: esp32-q001
  query: ESP32 Deep-sleep 模式下的典型功耗是多少？哪些内容在 Deep-sleep 期间保持供电？
  expected_answer: Deep-sleep 模式下功耗为 10 µA；RTC 存储器、RTC 外设和 ULP 协处理器保持供电，Wi-Fi/Bluetooth
    连接数据可保存在 RTC 存储器中。
