  question_type: table_query
- id: stm32f4-q006
  query: STM32F4 SWJ-DP 调试端口引脚分配中，PA13、PA14、PA15、PB3、PB4 的默认功能是什么？
  expected_answer: PA13 对应 JTMS/SWDIO，PA14 对应 JTCK/SWCLK，PA15 对应 JTDI，PB3 对应 JTDO/TRACESWO，PB4
    对应 JTRST；通过关闭部分 JTAG 功能可释放部分引脚作 GPIO 使用。
  source_pdf: data/pdfs/mcu/stm32f4_gpio_exti_extract.pdf
