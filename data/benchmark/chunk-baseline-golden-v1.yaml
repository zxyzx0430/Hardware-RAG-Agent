- id: esp32-q008
  query: ESP32 进入 Deep-sleep 后如何保持 GPIO 状态？
  expected_answer: 进入 Deep-sleep 前可通过 GPIO hold 功能锁定引脚状态；此外 RTC 存储器和 ULP 协处理器在 Deep-sleep
    期间保持供电，可用于维护状态或在唤醒后恢复。
