  question_type: cross_page
- id: ch340g-q007
  query: CH340G USB 转 RS232 适配器应用电路主要包含哪些核心器件？
  expected_answer: 核心器件包括 CH340G 芯片、外部电平转换芯片（如 MAX213/MAX232 系列）、晶振（12MHz）及负载电容、USB
    连接器以及 DB9 串口连接器。
  source_pdf: data/pdfs/interface/ch340g_datasheet.pdf
