  question_type: fact_extraction
- id: ch340g-q003
  query: CH340G 支持哪些硬件流控信号？
  expected_answer: CH340G 支持 CTS#（Clear to Send）、DSR#（Data Set Ready）、RI#（Ring In）、DCD#（Data
    Carrier Detect）、DTR#（Data Terminal Ready）和 RTS#（Request to Send）这些 MODEM/硬件流控信号。
  source_pdf: data/pdfs/interface/ch340g_datasheet.pdf
