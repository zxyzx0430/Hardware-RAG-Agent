  question_type: image_description
- id: ch340g-q008
  query: CH340G 光隔离 USB 转 UART 适配器的设计要点是什么？
  expected_answer: 该适配器使用 4 个 PC817 光耦实现输入/输出光隔离；Layout 时需尊重隔离边界并尽可能在光耦下方开槽；两个 74LVC1G06
    反相器为可选器件，用于输入引脚驱动电流不足时增强驱动。
  source_pdf: data/pdfs/interface/ch340g_datasheet.pdf
