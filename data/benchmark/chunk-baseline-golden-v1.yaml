- id: ch340g-q001
  query: CH340G 的 VCC 供电电压范围是多少？5V 和 3.3V 工作时分别有什么要求？
  expected_answer: CH340G 支持 5V 和 3.3V 工作。5V 工作时 VCC 接 4.5V~5.5V，V3 引脚需通过 4.7nF~20nF（通常
    0.1μF）电容退耦到地；3.3V 工作时 V3 与 VCC 短接，共同输入 3.3V（范围 3.3V~3.8V）。
  source_pdf: data/pdfs/interface/ch340g_datasheet.pdf
  source_pages:
  - 3
  - 4
  relevant_chunks:
  - 12f13dda-4d71-4a4a-9870-fe7e9d7e5062#s30
  - 12f13dda-4d71-4a4a-9870-fe7e9d7e5062#s39
  - 12f13dda-4d71-4a4a-9870-fe7e9d7e5062#s38
  question_type: fact_extraction
- id: ch340g-q002
  query: CH340G XI 引脚外接晶振的频率典型值是多少？
  expected_answer: CH340G 在 XI 引脚需要 12MHz 的时钟信号，典型晶振频率为 12.00MHz（范围 11.98MHz~12.02MHz）。
  source_pdf: data/pdfs/interface/ch340g_datasheet.pdf
