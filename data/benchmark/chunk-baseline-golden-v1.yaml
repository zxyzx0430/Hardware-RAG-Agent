  question_type: table_query
- id: ch340g-q006
  query: CH340G 5V 供电时，V3 引脚接多大退耦电容？该信息在引脚表和应用说明中分别如何描述？
  expected_answer: 5V 供电时 V3 引脚应接 4.7nF~20nF 退耦电容到地（引脚表描述为 Internal 3.3V reference
    for USB physical layer, decouple with 4.7-20nF capacitor when in 5V operation；应用说明描述为
    decouple the internal 3.3V reference with a capacitor of 4.7-20nF from V3 pin
    to ground）。
  source_pdf: data/pdfs/interface/ch340g_datasheet.pdf
  source_pages:
  - 4
  relevant_chunks:
  - 12f13dda-4d71-4a4a-9870-fe7e9d7e5062#s30
