  question_type: cross_page
- id: stm32f4-q009
  query: 描述 STM32F4 GPIO 复用功能选择框图（Figure 26/27）的主要结构。
  expected_answer: 框图显示了 I/O 引脚通过多路选择器（multiplexer）连接到片上外设；每个引脚的具体复用功能由 GPIOx_AFRH/AFRH
    寄存器的 AFSEL 位选择（AF0~AF15），可灵活地将同一外设功能映射到不同引脚。
