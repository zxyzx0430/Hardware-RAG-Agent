  - 12f13dda-4d71-4a4a-9870-fe7e9d7e5062#s13
  question_type: table_query
- id: ch340g-q005
  query: CH340G 引脚表中，TXD 和 RXD 的方向和功能分别是什么？
  expected_answer: TXD（Pin 2）为 Output，是 UART 数据发送输出；RXD（Pin 3）为 Input，是 UART 数据接收输入。
  source_pdf: data/pdfs/interface/ch340g_datasheet.pdf
