- id: esp32-q006
  query: ESP32 芯片启动模式由哪些 strapping pin 控制？进入 SPI Boot 和 Joint Download Boot 分别需要什么电平？
  expected_answer: 启动模式由 GPIO0 和 GPIO2 控制：SPI Boot 模式需要 GPIO0=1（GPIO2 任意值）；Joint Download
    Boot 模式需要 GPIO0=0 且 GPIO2=0。
  source_pdf: data/pdfs/mcu/esp32_datasheet.pdf
