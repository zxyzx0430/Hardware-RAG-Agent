- id: esp32-q002
  query: ESP32 内部 SRAM、RTC SRAM 和 ROM 的容量分别是多少？
  expected_answer: ESP32 内部包含 448 KB ROM、520 KB SRAM 以及 16 KB RTC SRAM（其中 8 KB 为 RTC
    FAST Memory，8 KB 为 RTC SLOW Memory）。
