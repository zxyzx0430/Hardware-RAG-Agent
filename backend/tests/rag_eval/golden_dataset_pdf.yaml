- id: G003
  question: STM32F4 GPIO 锁定机制（LCKR）的具体操作步骤是什么？锁定序列是如何工作的？
  standard_answer: '根据 RM0090 参考手册（第8章 GPIO，Section 8.3.6 和 8.4.8），GPIOx_LCKR 寄存器用于冻结
    I/O 配置。


    锁定机制工作原理：

    - LOCK_KEY 序列写入 GPIOx_LCKR 寄存器后，GPIOx_MODER、GPIOx_OTYPER、GPIOx_OSPEEDR、GPIOx_PUPDR、GPIOx_OSPEEDR、GPIOx_AFRL
    和 GPIOx_AFRH 寄存器将被冻结

    - 一旦冻结，在下一次复位之前不能更改这些寄存器的值

    - 每个 I/O 端口的锁定是独立的


    锁定序列（需按特定顺序写入 32 位序列）：

    1. 向 GPIOx_LCKR 写入 LOCK_KEY（bit 16 = 1）加上要锁定的位

    2. 再次写入 LOCK_KEY 加上要锁定的位

    3. 再次写入 LOCK_KEY 加上要锁定的位

    4. 读取 GPIOx_LCKR

    5. 再次写入 LOCK_KEY 加上要锁定的位


    如果锁定序列中出现任何错误，锁定操作将被中止。

    首次锁定序列后，LCKK 位（bit 16）读取值为 1 表示端口已成功锁定。

    '
  reference_chunks:
  - The GPIOx_LCKR register is used to lock the configuration of the GPIO port. When
    a LOCK sequence has been applied on a port, the value of the GPIOx_MODER, GPIOx_OTYPER,
    GPIOx_OSPEEDR, GPIOx_PUPDR, GPIOx_AFRL and GPIOx_AFRH registers cannot be modified
    until the next MCU reset.
  - 'LOCK_KEY sequence: Write 1 to LCKR bit 16, then write 1 again, then write 1 again,
    then read LCKR, then write 1 again.'
  - Any error in the lock sequence aborts the lock. After the first lock sequence
    the LCKK bit reads as 1.
  difficulty: 中等
  category: GPIO
