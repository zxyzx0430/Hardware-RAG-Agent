samples:
- id: G001
  question: STM32F4 GPIO 有哪几种工作模式？MODER 寄存器中每种模式对应的二进制编码是什么？
  standard_answer: '根据 RM0090 参考手册（第8章 GPIO），STM32F4 的每个 GPIO 端口位可以独立配置为以下模式，由 GPIOx_MODER
    寄存器控制：


    每个端口位占 2 个 bit（MODERy[1:0]），四种编码：

    - 00：输入模式 (Input) — 引脚配置为数字输入

    - 01：通用输出模式 (General purpose output) — 引脚配置为推挽或开漏输出

    - 10：复用功能模式 (Alternate function) — 引脚交给外设控制

    - 11：模拟模式 (Analog) — 引脚配置为模拟输入/输出


    此外，具体子模式还包括：

    - 输入浮动 (Input floating)

    - 输入上拉 (Input pull-up)

    - 输入下拉 (Input pull-down)

    - 模拟 (Analog)

    - 输出开漏带上拉/下拉

    - 输出推挽带上拉/下拉

    - 复用功能推挽带上拉/下拉

    - 复用功能开漏带上拉/下拉


    输出类型由 OTYPER 寄存器选择（0=推挽, 1=开漏），上拉/下拉由 PUPDR 寄存器选择。

    '
  reference_chunks:
  - 'MODERy[1:0]: Port x configuration bits (y = 0..15) These bits are written by
    software to configure the corresponding I/O mode. 00: Input (reset state) 01:
    General purpose output mode 10: Alternate function mode 11: Analog mode'
  - 'Port bit config table: MODER[1:0] 00 Input, 01 GP output PP, 10 AF PP, 11 Analog'
  - Input floating, Input pull-up, Input-pull-down, Analog, Output open-drain, Output
    push-pull, Alternate function push-pull, Alternate function open-drain
