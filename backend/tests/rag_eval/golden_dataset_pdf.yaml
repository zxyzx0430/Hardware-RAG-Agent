- id: G005
  question: SYSCFG_EXTICR 寄存器如何选择 EXTI 中断的 GPIO 端口？各端口对应的编码是什么？
  standard_answer: '根据 RM0090 参考手册（第9章 SYSCFG，Section 9.2.3-9.2.6），SYSCFG_EXTICR 寄存器用于选择外部中断线（EXTI
    Line）连接到哪个 GPIO 端口。


    SYSCFG 提供 4 个 EXTICR 寄存器（EXTICR1-EXTICR4），每个寄存器控制 4 条 EXTI 线：

    - SYSCFG_EXTICR1：EXTI0-EXTI3

    - SYSCFG_EXTICR2：EXTI4-EXTI7

    - SYSCFG_EXTICR3：EXTI8-EXTI11

    - SYSCFG_EXTICR4：EXTI12-EXTI15


    每条 EXTI 线占 4 个 bit（EXTIx[3:0]），端口选择编码：

    - 0000：PA[x] pin

    - 0001：PB[x] pin

    - 0010：PC[x] pin

    - 0011：PD[x] pin

    - 0100：PE[x] pin

    - 0101：PF[x] pin

    - 0110：PG[x] pin

    - 0111：PH[x] pin

    - 1000：PI[x] pin（仅部分封装）


    例如，要将 EXTI Line13 配置为 PC13 触发：

    设置 SYSCFG_EXTICR4 的 EXTI13[3:0] = 0010（选择 PC）


    注意：EXTI Line0-3 只能选择 PA0-PA3（因为 EXTI0 与 PA0 共享），这是硬件限制。

    '
  reference_chunks:
  - 'SYSCFG_EXTICR1 external interrupt configuration register 1: 0000: PA[x] pin 0001:
    PB[x] pin 0010: PC[x] pin 0011: PD[x] pin 0100: PE[x] pin'
  - 'EXTIx[3:0]: EXTI x configuration (x = 0 to 3) These bits are written by software
    to select the source of the external interrupt/event request.'
  - '0000: PA[x] pin 0001: PB[x] pin 0010: PC[x] pin 0011: PD[x] pin 0100: PE[x] pin
    0101: PF[x] pin 0110: PG[x] pin 0111: PH[x] pin'
