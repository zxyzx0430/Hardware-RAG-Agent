- id: G004
  question: STM32F4 EXTI 中断线 5-9 和 10-15 为什么共享 NVIC 向量？EXTI 控制器有哪些关键寄存器？
  standard_answer: '根据 RM0090 参考手册（第12章 Interrupts and events），STM32F4 的 EXTI 控制器中：


    NVIC 向量共享原因：

    - EXTI Line[0] 到 EXTI Line[4] 各有独立的 NVIC 中断向量（IRQ 6-10）

    - EXTI Line[5] 到 EXTI Line[9] 共享一个 NVIC 向量 EXTI9_5（IRQ 23）

    - EXTI Line[10] 到 EXTI Line[15] 共享一个 NVIC 向量 EXTI15_10（IRQ 40）

    这是因为 Cortex-M4 NVIC 的中断向量数量有限，STM32F4 通过共享向量来节省中断资源。软件需要在 ISR 中通过读取 EXTI_PR 寄存器来判断具体是哪条中断线触发。


    EXTI 控制器关键寄存器：

    - EXTI_IMR：中断屏蔽寄存器（Interrupt mask register）

    - EXTI_EMR：事件屏蔽寄存器（Event mask register）

    - EXTI_RTSR：上升沿触发选择寄存器（Rising trigger selection register）

    - EXTI_FTSR：下降沿触发选择寄存器（Falling trigger selection register）

    - EXTI_SWIER：软件中断事件寄存器（Software interrupt event register）

    - EXTI_PR：挂起寄存器（Pending register）


    配置 EXTI 中断需要通过 SYSCFG_EXTICR 寄存器选择 GPIO 端口。

    '
  reference_chunks:
  - EXTI9_5 EXTI Line[9:5] interrupts
  - EXTI15_10 EXTI Line[15:10] interrupts
  - 23 settable EXTI9_5 EXTI Line[9:5] interrupts 0x0000 009C
  - 40 47 settable EXTI15_10 External interrupt/event controller 0x0000 00C8
  - Configure the mask bits of the 23 interrupt lines (EXTI_IMR) Configure the edge
    selection bits (EXTI_RTSR and EXTI_FTSR)
