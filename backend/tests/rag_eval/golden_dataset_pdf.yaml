- id: G002
  question: STM32F4 GPIO 输出速度有几个等级？OSPEEDR 寄存器中各等级对应的二进制编码是什么？
  standard_answer: '根据 RM0090 参考手册（第8章 GPIO），STM32F4 的 GPIO 输出速度由 GPIOx_OSPEEDR 寄存器控制，有四个等级：


    每个端口位占 2 个 bit（OSPEEDRy[1:0]），四种编码：

    - 00：低速 (Low speed)

    - 01：中速 (Medium speed)

    - 10：高速 (High speed)

    - 11：极高速 (Very high speed)


    注意：具体的频率值（如 2MHz/25MHz/50MHz/100MHz）在数据手册 (datasheet) 的电气参数表中定义，参考手册只给出等级名称。速度等级适用于输出方向，但输入方向的速度寄存器位也必须正确配置。


    I/O 速度引脚直接连接到对应的 GPIOx_OSPEEDR 寄存器位，无论 I/O 方向如何。

    '
  reference_chunks:
  - 'OSPEEDRy[1:0]: Port x speed bits (y = 0..15) These bits are written by software
    to configure the I/O output speed. 00: Low speed 01: Medium speed 10: High speed
    11: Very high speed'
  - The I/O speed pins are directly connected to the corresponding GPIOx_OSPEEDR register
    bits whatever the I/O direction.
  - OSPEEDR5[1:0] OSPEEDR4[1:0] OSPEEDR3[1:0] OSPEEDR2[1:0] OSPEEDR1[1:0] OSPEEDR0[1:0]
