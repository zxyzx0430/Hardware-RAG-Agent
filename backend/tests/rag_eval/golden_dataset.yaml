  - id: G025
    question: "STM32F4 和 STM32H7 在内核、主频、SRAM、Flash 方面有什么区别？"
    standard_answer: |
      - STM32F4：Cortex-M4 内核，主频 168MHz，192KB SRAM，1MB Flash，LQFP100 封装，16 路 DMA 流（2 个控制器）
      - STM32H7：Cortex-M7 内核，主频 480MHz，1MB SRAM，2MB Flash，支持 QSPI
      STM32H7 性能约为 STM32F4 的 3 倍（主频 480/168 ≈ 2.86x）。
