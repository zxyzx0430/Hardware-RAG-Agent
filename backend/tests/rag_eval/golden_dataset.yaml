  - id: G027
    question: "MPU6050 的 I2C 地址怎么选择？AD0 引脚的作用是什么？"
    standard_answer: |
      MPU6050 的 I2C 7 位地址由 AD0 引脚决定：
      - AD0 接地（GND）：地址 = 0x68
      - AD0 接 VCC：地址 = 0x69
      这样同一总线上可以挂两个 MPU6050（一个 AD0 接地，一个接 VCC）。
      注意：DS3231 RTC 的地址也是 0x68，与 MPU6050 冲突，不能同时挂在同一总线。
    reference_chunks:
