  - id: G030
    question: "STM32 晶振的负载电容如何计算？HSE 8MHz 晶振配多大的负载电容？"
    standard_answer: |
      负载电容计算公式：CL = (C1 × C2) / (C1 + C2) + Cs
      - CL：晶振规格书标注的负载电容值（如 8MHz 晶振常见 CL=12pF 或 18pF）
      - C1/C2：两个外部匹配电容（通常相等）
      - Cs：寄生电容（PCB 走线 + 引脚，典型 3-5pF）
      计算：若 CL=18pF, Cs=5pF，则 (C1×C2)/(C1+C2) = 13pF，C1=C2=26pF（取标准值 27pF 或 22pF）
      LSE 32.768kHz 晶振 CL 通常更小（6-12pF）。
    reference_chunks:
      - "晶振负载电容公式：CL=(C1×C2)/(C1+C2)+Cs。Cs 为寄生电容 3-5pF。HSE 8MHz 晶振 CL=18pF 时 C1=C2≈26pF(取 27pF)。LSE 32.768kHz CL 更小 6-12pF。"
    difficulty: 中等
    category: 时钟
    target_doc: 06-hardware-terms-glossary.md
    tags: [晶振, HSE, 负载电容, CL, 计算]
