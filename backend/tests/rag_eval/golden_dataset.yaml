  - id: G021
    question: "STM32 UART 使用 DMA 传输时需要注意哪些问题？接收缓冲区的循环模式怎么防止数据覆盖？"
    standard_answer: |
      UART DMA 传输注意事项：
      - 接收用循环模式（DMA_CIRCULAR），发送用正常模式（DMA_NORMAL）
      - 循环模式防止数据覆盖：开启半传输中断（HT）+ 完成传输中断（TC），双缓冲策略——HT 中断处理前半缓冲区，TC 中断处理后半缓冲区
      - 缓冲区大小 = 预期单次最大数据量 × 2
      - DMA 中断优先级应高于 UART 中断，避免数据丢失
    reference_chunks:
      - "UART DMA 接收用循环模式(DMA_CIRCULAR)。防覆盖：开半传输中断(HT)+完成中断(TC)双缓冲，HT 处理前半，TC 处理后半。DMA 中断优先级应高于 UART。"
    difficulty: 中等
    category: UART
    target_doc: 05-uart-serial.md
    tags: [UART, DMA, 循环模式, 半传输, 双缓冲]
    notes: ""

  - id: G022
    question: "UART 通信中出现随机错误位，可能是什么原因？怎么排查和解决？"
    standard_answer: |
      可能原因和排查：
      1. 电磁干扰（EMI）：换屏蔽线，串联 22-100Ω 电阻匹配阻抗
      2. 波特率误差：检查时钟源（HSI ±1% 不够，高波特率用 HSE ±20ppm）
      3. 电平不匹配：TTL(3.3V) 直接接 RS-232(±12V) 会损坏，需 MAX3232 转换
      4. 接线问题：GND 未共地
      5. 波特率容限：8N1 理论 ±2.63%，工程取 ±2.5%
    reference_chunks:
      - "UART 随机错误原因：EMI 干扰(用屏蔽线+串联电阻)、波特率误差(HSI ±1% 不够用 HSE)、电平不匹配(TTL vs RS-232 需 MAX3232)、GND 未共地。8N1 容限 ±2.5%。"
    difficulty: 简单
    category: UART
    target_doc: 05-uart-serial.md
    tags: [UART, 噪声, EMI, 波特率, RS-232, TTL]
