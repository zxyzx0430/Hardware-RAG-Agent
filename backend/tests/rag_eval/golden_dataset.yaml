  - id: G026
    question: "ESP32-S3 的 Strapping 引脚有哪些？正常启动需要什么电平？"
    standard_answer: |
      ESP32-S3 的 Strapping 引脚：
      - GPIO0：控制启动模式。高电平=正常工作模式，低电平=下载模式。用 10kΩ 上拉电阻确保正常启动
      - GPIO46：控制 Flash 电压。低电平=3.3V（默认），高电平=1.8V
      - GPIO45：控制内核电压（VDD_SPI）
      上电瞬间这些引脚的电平决定芯片工作模式，必须用电阻固定到期望电平。
    reference_chunks:
