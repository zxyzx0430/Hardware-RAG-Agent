    target_doc: 02-esp32-wifi.md
    tags: [ESP32, WiFi, 省电, WIFI_PS_NONE, TCP]
    notes: ""

  - id: G008
    question: "ESP32 WiFi 初始化的完整流程是什么？NVS 为什么必须先初始化？"
    standard_answer: |
      ESP32 WiFi 初始化 8 步：
      1. nvs_flash_init() — 初始化 NVS 存储
      2. esp_event_loop_create_default() — 创建事件循环
      3. esp_netif_create_default_wifi_sta() — 创建默认 STA 网络接口
      4. WIFI_INIT_CONFIG_DEFAULT() + esp_wifi_init() — 初始化 WiFi 驱动
      5. 注册 WIFI_EVENT / IP_EVENT handler
      6. esp_wifi_set_mode(WIFI_MODE_STA) + esp_wifi_set_config()
      7. esp_wifi_start()
      8. 事件驱动 esp_wifi_connect()
      NVS 必须先初始化，因为 WiFi 驱动内部用 NVS 存储校准数据和连接配置。
    reference_chunks:
      - "ESP32 WiFi 初始化 8 步：nvs_flash_init → esp_event_loop_create_default → esp_netif_create_default_wifi_sta → WIFI_INIT_CONFIG_DEFAULT + esp_wifi_init → 注册 event handler → esp_wifi_set_mode(WIFI_MODE_STA) + esp_wifi_set_config → esp_wifi_start → esp_wifi_connect。NVS 存储 WiFi 校准数据必须先初始化。"
    difficulty: 中等
    category: 启动配置
    target_doc: 02-esp32-wifi.md
    tags: [ESP32, WiFi, NVS, 初始化, 事件循环]
    notes: ""

  - id: G009
    question: "ESP32 WiFi 断连时 reason code 15 和 201 有什么区别？重连策略应如何区分处理？"
    standard_answer: |
      - reason code 15（4WAY_HANDSHAKE_TIMEOUT）：通常是密码错误，重连也不会成功，应停止重试并提示用户检查密码
      - reason code 201（NO_AP_FOUND）：AP 不在范围内或信号太弱，可以继续重试（等设备靠近 AP）
      - reason code 202（AUTH_FAIL）：认证失败，类似 15 应停止
      策略：15/202 停止重试，201 可重试但加 RSSI 检查（<-90 跳过）。
    reference_chunks:
      - "reason code 15=4WAY_HANDSHAKE_TIMEOUT 密码错误应停止重试；201=NO_AP_FOUND 可重试；202=AUTH_FAIL 停止。RSSI<-90 跳过重试。"
    difficulty: 难
    category: 启动配置
    target_doc: 02-esp32-wifi.md
    tags: [ESP32, WiFi, reason code, 4WAY_HANDSHAKE_TIMEOUT, 重连]
    notes: "测试精确参数召回"

  - id: G010
    question: "ESP32 WiFi 的 listen_interval 和 DTIM 有什么关系？为什么 listen_interval=30 可能导致被 AP 踢出？"
    standard_answer: |
      - DTIM 是 AP 发送缓冲多播数据的信标间隔，通常 1/3/10
      - listen_interval 是 STA 告诉 AP 自己多久醒一次听信标
      - listen_interval=3 省电约 20%，=10 省电约 50%，=30 省电约 70%
      - listen_interval=30 可能导致被 AP 踢出：AP 认为 STA 长时间不响应，主动断开连接以释放缓冲区资源
    reference_chunks:
      - "ESP32 listen_interval 与 DTIM 关系：DTIM=1/3/10，listen_interval=3 省 20%、=10 省 50%、=30 省 70%。listen_interval=30 可能被 AP 踢出因长时间不响应。"
    difficulty: 难
    category: 电源
    target_doc: 02-esp32-wifi.md
    tags: [ESP32, WiFi, listen_interval, DTIM, 省电]
    notes: ""

