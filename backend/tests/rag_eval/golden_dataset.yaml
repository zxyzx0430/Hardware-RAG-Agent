  - id: G016
    question: "Cortex-M3 的 NVIC 优先级分组如何配置？如果 USART1 抢占优先级为 1、TIM2 抢占优先级为 2，当中断同时到达时谁先执行？"
    standard_answer: |
      通过 SCB->AIRCR 寄存器的 PRIGROUP 字段配置分组：
      - STM32F4 实现 4 位优先级（16 级），推荐 NVIC_PRIORITYGROUP_4（PRIGROUP=7）：16 个抢占优先级、0 个子优先级
      - 数值小 = 优先级高
      - USART1 抢占优先级 1 < TIM2 抢占优先级 2，所以 USART1 先执行并能抢占 TIM2
    reference_chunks:
      - "NVIC 优先级分组通过 AIRCR PRIGROUP 配置。STM32F4 推荐 NVIC_PRIORITYGROUP_4(PRIGROUP=7)：16 抢占/0 子。数值小=优先级高。USART1 优先级 1 < TIM2 优先级 2，USART1 先执行。"
