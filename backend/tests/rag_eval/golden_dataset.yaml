  - id: G017
    question: "Cortex-M4 的中断延迟是多少个时钟周期？尾链（Tail-Chaining）和迟来（Late-Arrival）技术分别如何降低延迟？"
    standard_answer: |
      - Cortex-M3/M4/M7 中断延迟：12 个时钟周期（零等待内存）
      - 含 FPU 上下文保存：28 周期
      - 尾链（Tail-Chaining）：当异常返回时恰好有挂起异常，跳过出栈+压栈，直接切换，节省约 12 周期（从 18 降到 6）
      - 迟来（Late-Arrival）：高优先级异常在低优先级异常压栈过程中到达，跳过低优先级的出栈，直接处理高优先级，节省约 16 周期
    reference_chunks:
      - "Cortex-M4 中断延迟 12 周期。尾链 Tail-Chaining 跳过出栈+压栈直接切换，省约 12 周期。迟来 Late-Arrival 高优先级在低优先级压栈中到达，省约 16 周期。含 FPU 保存 28 周期。"
    difficulty: 难
    category: 中断
    target_doc: 04-cortexm-interrupt.md
    tags: [Cortex-M, 中断延迟, 尾链, 迟来, FPU]
    notes: ""

  - id: G018
    question: "STM32 HAL_NVIC_SetPriority 的优先级数值是越大越高还是越小越高？HAL_NVIC_SetPriority(15, 0) 是什么含义？"
    standard_answer: |
      - 数值越小 = 优先级越高（这是 ARM NVIC 的设计，与直觉相反）
      - HAL_NVIC_SetPriority(15, 0) 中 15 是抢占优先级，0 是子优先级
      - 在 NVIC_PRIORITYGROUP_4（16 抢占/0 子）下，15 是最低优先级
      - 常见陷阱：误以为 15 是最高优先级，导致关键中断被低优先级中断抢占
    reference_chunks:
      - "NVIC 优先级数值小=高。HAL_NVIC_SetPriority(15,0) 在 PRIORITYGROUP_4 下 15 是最低优先级。常见陷阱：误以为数值大=优先级高。"
    difficulty: 中等
    category: 中断
    target_doc: 04-cortexm-interrupt.md
    tags: [NVIC, 优先级, 陷阱, HAL_NVIC_SetPriority]
    notes: "测试易混淆点"

  - id: G019
    question: "PRIMASK、FAULTMASK、BASEPRI 三个全局屏蔽寄存器有什么区别？FreeRTOS 为什么用 BASEPRI？"
    standard_answer: |
      - PRIMASK：屏蔽所有可屏蔽异常（除 NMI 和 HardFault），__disable_irq() 就是设 PRIMASK
      - FAULTMASK：屏蔽所有异常（含 HardFault，除 NMI），比 PRIMASK 更强
      - BASEPRI：屏蔽优先级数值 ≥ BASEPRI 值的异常，保留高优先级中断
      FreeRTOS 用 BASEPRI 因为临界区只需屏蔽低优先级中断（内核相关），保留高优先级中断（如硬件紧急事件）的实时响应。
    reference_chunks:
      - "PRIMASK 屏蔽所有 IRQ；FAULTMASK 含 HardFault；BASEPRI 屏蔽优先级≥设定值的异常。FreeRTOS 用 BASEPRI 保留高优先级中断实时响应。__set_BASEPRI(5<<(8-__NVIC_PRIO_BITS))。"
    difficulty: 难
    category: 中断
    target_doc: 04-cortexm-interrupt.md
    tags: [PRIMASK, FAULTMASK, BASEPRI, FreeRTOS, 临界区]
    notes: ""

  - id: G020
    question: "STM32 的中断服务函数 ISR 中为什么必须清除中断源标志？USART1 的 RXNE 标志如何清除？"
    standard_answer: |
      - 如果不清除中断源标志，退出 ISR 后 NVIC 会立即重新触发同一中断，导致死循环（ISR 重入）
      - USART1 的 RXNE（接收缓冲区非空）标志清除方式：读 DR 寄存器（USART1->DR），读操作自动清除 RXNE
      - 也可以写 1 到 USART_SR 的 RXNE 位清除（但读 DR 是常规做法）
      - 其他外设标志：ADC 的 EOC 写 0 清除、EXTI 的 PR 写 1 清除
    reference_chunks:
      - "ISR 必须清除中断源否则退出后立即重入。USART1 RXNE 清除：读 DR 寄存器(USART1->DR)自动清。EXTI PR 写 1 清除。"
    difficulty: 中等
    category: 中断
    target_doc: 04-cortexm-interrupt.md
    tags: [ISR, RXNE, USART1, 中断标志, DR]
    notes: ""

