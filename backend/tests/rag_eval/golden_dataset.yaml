  - id: G011
    question: "I2C 多主机通信时如何仲裁？仲裁失败的从机应该做什么？"
    standard_answer: |
      I2C 仲裁基于线与（wired-AND）特性：
      - 多个主机同时发起点，输出 0 的主机覆盖输出 1 的主机
      - 主机在发送 1 时检测到 SDA 为 0，则判定仲裁丢失
      - 仲裁丢失的主机应：释放总线（停止驱动 SDA）、切换为从机模式、等待 BUSY 标志清除、延迟 1ms 退避后重试
    reference_chunks:
      - "I2C 多主机仲裁基于线与特性：输出 0 覆盖输出 1。主机发送 1 时检测 SDA=0 则仲裁丢失。仲裁失败的主机应释放总线、切从机模式、等 BUSY 清除、延迟 1ms 退避重试。"
    difficulty: 中等
    category: I2C
    target_doc: 03-i2c-protocol.md
    tags: [I2C, 多主机, 仲裁, SDA, 线与]
    notes: ""

  - id: G012
    question: "从机时钟拉伸导致 I2C 通信阻塞时，主机应该怎么检测和处理？超时时间一般设为多少？"
    standard_answer: |
      时钟拉伸（Clock Stretching）是从机拉低 SCL 延迟通信的机制：
      - 主机检测 SCL 长时间被拉低（超过预期 tLOW）判定为时钟拉伸
      - 处理：设置超时（一般 10ms 或 100ms），超时后 HAL_I2C_Master_Transmit 返回 HAL_TIMEOUT
      - STM32 可通过 NoStretchMode 配置是否允许拉伸（推荐 I2C_NOSTRETCH_DISABLE 允许）
      - EEPROM 页写典型拉伸 5ms
    reference_chunks:
      - "I2C 时钟拉伸：从机拉低 SCL 延迟通信。主机设超时 10ms，超时返回 HAL_TIMEOUT。STM32 NoStretchMode 控制是否允许。EEPROM 页写拉伸约 5ms。"
    difficulty: 难
    category: I2C
    target_doc: 03-i2c-protocol.md
    tags: [I2C, 时钟拉伸, SCL, 超时, NoStretchMode]
    notes: ""

  - id: G013
    question: "I2C 上拉电阻如何计算？400kHz 速率下 100pF 总线电容时 Rp 取值范围是多少？"
    standard_answer: |
      上拉电阻计算公式：
      - tr = 0.8473 × Rp × Cb（tr 是上升时间，Cb 是总线电容）
      - Rp(min) = (VDD - VOL) / IOL ≈ 970Ω（VDD=3.3V, VOL=0.4V, IOL=3mA）
      - Rp(max) = tr / (0.8473 × Cb)
      400kHz 快速模式：tr ≤ 300ns，Cb=100pF 时 Rp(max) ≈ 3.5kΩ
      推荐值：标准模式 4.7-10kΩ、快速模式 2.2-4.7kΩ、Fm+ 1-2.2kΩ
    reference_chunks:
      - "I2C 上拉电阻公式：tr=0.8473×Rp×Cb。Rp(min)=(VDD-VOL)/IOL≈970Ω。400kHz tr≤300ns, Cb=100pF 时 Rp(max)≈3.5kΩ。推荐：标准 4.7-10kΩ、快速 2.2-4.7kΩ、Fm+ 1-2.2kΩ。"
    difficulty: 中等
    category: I2C
    target_doc: 03-i2c-protocol.md
    tags: [I2C, 上拉电阻, 400kHz, Cb, 计算]
    notes: ""

  - id: G014
    question: "MPU6050 的 I2C 7 位地址是 0x68，为什么在 STM32 HAL 调用时要传 0xD0？"
    standard_answer: |
      STM32 HAL I2C 函数的 addr 参数是 8 位地址（包含 R/W 位）：
      - 7 位地址 0x68 左移 1 位 = 0xD0（写方向，R/W=0）
      - 0x68 左移 1 位 + 1 = 0xD1（读方向，R/W=1）
      所以 HAL_I2C_Master_Transmit 传 0xD0，HAL_I2C_Master_Receive 传 0xD1。
      MPU6050 的 AD0 引脚接地时地址为 0x68，接 VCC 时为 0x69。
    reference_chunks:
      - "STM32 HAL I2C 地址是 8 位（含 R/W 位）。MPU6050 7 位地址 0x68 左移 1 位=0xD0(写)/0xD1(读)。AD0 接地=0x68，接 VCC=0x69。"
    difficulty: 中等
    category: I2C
    target_doc: 03-i2c-protocol.md
    tags: [I2C, MPU6050, 地址, HAL, "0x68"]
    notes: "测试易混淆点"

  - id: G015
    question: "I2C 总线死锁怎么恢复？写出恢复流程。"
    standard_answer: |
      I2C 总线死锁通常发生在从机在传输中途复位，导致 SDA 被拉低卡住。恢复流程：
      1. 禁用 I2C 外设
      2. 将 SCL 配为 GPIO 推挽输出
      3. 手动产生 9 个 SCL 时钟脉冲（让从机移出剩余数据位，释放 SDA）
      4. 手动发送一个 STOP 条件（SCL 高时 SDA 从低到高）
      5. 恢复 SCL/SDA 为 I2C 复用功能
      6. 重新 HAL_I2C_Init
    reference_chunks:
      - "I2C 总线死锁恢复：禁用 I2C → SCL 配 GPIO → 发 9 个 SCL 时钟 → 手动发 STOP → 恢复复用 → 重新 HAL_I2C_Init。从机中途复位导致 SDA 卡低。"
    difficulty: 难
    category: I2C
    target_doc: 03-i2c-protocol.md
    tags: [I2C, 死锁, 恢复, SCL, bit-bang]
    notes: "测试故障恢复流程"

