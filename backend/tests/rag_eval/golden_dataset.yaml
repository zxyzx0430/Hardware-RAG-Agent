  - id: G023
    question: "STM32 波特率如何计算？fck=72MHz、目标 115200bps 时 USARTDIV 和 BRR 的值是多少？"
    standard_answer: |
      波特率公式：波特率 = fck / (16 × USARTDIV)（OVER8=0）
      - USARTDIV = fck / (16 × 波特率) = 72000000 / (16 × 115200) = 39.0625
      - BRR = USARTDIV × 16 = 625 = 0x0271
      - 实际波特率 = 72000000 / (16 × 39.0625) = 115384.6 bps
      - 误差 = (115384.6 - 115200) / 115200 = +0.16%（在 ±2.5% 容限内）
    reference_chunks:
      - "STM32 波特率公式：波特率=fck/(16×USARTDIV)。fck=72MHz 目标 115200：USARTDIV=39.0625，BRR=0x0271，实际 115384.6，误差 +0.16%。"
    difficulty: 中等
    category: UART
    target_doc: 05-uart-serial.md
    tags: [UART, 波特率, USARTDIV, BRR, 计算]
    notes: ""

  - id: G024
    question: "STM32 UART 配置 8 位字长 + 偶校验（Even Parity）时，实际数据位是几位？要 8 位数据 + 偶校验应该怎么配？"
    standard_answer: |
      这是一个常见陷阱：
      - STM32 UART 的 WordLength 包含校验位
      - UART_WORDLENGTH_8B + UART_PARITY_EVEN：实际只有 7 位数据 + 1 位校验 = 8 位总长
      - 要 8 位数据 + 偶校验：必须选 UART_WORDLENGTH_9B（9 位总长 = 8 数据 + 1 校验）
      - 不校验时 UART_WORDLENGTH_8B 才是真正 8 位数据
    reference_chunks:
      - "STM32 UART 字长含校验位。8B+Even 实际 7 数据+1 校验。要 8 数据+Even 必须选 9B(9=8数据+1校验)。不校验时 8B 才是真正 8 数据。"
    difficulty: 中等
    category: UART
    target_doc: 05-uart-serial.md
    tags: [UART, 字长, 校验, 陷阱, WordLength]
    notes: "测试易混淆点"

