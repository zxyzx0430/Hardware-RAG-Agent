  - id: G028
    question: "WS2812 RGB LED 的时序要求是什么？STM32 如何驱动 WS2812？"
    standard_answer: |
      WS2812 时序（单线协议）：
      - 0 码：高电平 0.35μs + 低电平 0.8μs（总 1.25μs）
      - 1 码：高电平 0.9μs + 低电平 0.35μs（总 1.25μs）
      - 复位：低电平 >50μs
      STM32 驱动方案：用 PWM + DMA。每个 bit 用一个 PWM 周期，占空比决定 0/1。DMA 自动传输整个数据帧，避免 CPU 中断抖动影响时序。
      典型配置：PWM 频率 800kHz（周期 1.25μs）。
    reference_chunks:
      - "WS2812 时序：0 码高 0.35μs+低 0.8μs，1 码高 0.9μs+低 0.35μs，复位低 >50μs。STM32 用 PWM+DMA 驱动，PWM 800kHz，DMA 传整个数据帧避免时序抖动。"
    difficulty: 中等
