  - id: G029
    question: "STM32 的 HAL 库和 LL 库有什么区别？什么场景下应该用 LL 库？"
    standard_answer: |
      - HAL（Hardware Abstraction Layer）库：跨系列兼容，API 高层抽象，代码量大，效率较低，适合快速开发和跨系列移植
      - LL（Low-Layer）库：接近寄存器操作，代码精简，效率高，但跨系列兼容性差，适合对性能/代码体积敏感的场景
      选择建议：原型开发用 HAL，量产优化用 LL，中断频繁的场景（如高频 SPI）建议 LL。
    reference_chunks:
      - "STM32 HAL 库跨系列兼容但效率低；LL 库接近寄存器效率高但兼容性差。原型用 HAL，量产优化用 LL，高频中断场景建议 LL。"
    difficulty: 简单
    category: 工具链
    target_doc: 06-hardware-terms-glossary.md
    tags: [STM32, HAL, LL, 库, 对比]
