  - id: G001
    question: "STM32 的 GPIO 引脚可以配置为哪四种工作模式？每种模式对应的 MODER 寄存器值是什么？"
    standard_answer: |
      STM32 的 GPIO 有四种工作模式，由 MODER 寄存器控制：
      1. 输入模式（MODER=00）：引脚配置为数字输入
      2. 输出模式（MODER=01）：引脚配置为数字输出
      3. 复用功能模式（MODER=10）：引脚交给外设（如 SPI/I2C/UART）控制
      4. 模拟模式（MODER=11）：引脚配置为模拟输入（ADC/DAC）
    reference_chunks:
      - "STM32 GPIO 工作模式由 MODER 寄存器控制：输入模式 MODER=00、输出模式 MODER=01、复用功能模式 MODER=10、模拟模式 MODER=11。"
      - "GPIOx_MODER 寄存器配置：00=输入模式、01=输出模式、10=复用功能(AF)、11=模拟模式。"
    difficulty: 简单
    category: GPIO
    target_doc: 01-stm32-gpio.md
    tags: [STM32, GPIO, MODER, 寄存器]
    notes: ""

  - id: G002
    question: "STM32 GPIO 的输出速度有哪几个等级？在什么场景下应该选择不同的速度？"
    standard_answer: |
      STM32F4 的 GPIO 输出速度由 OSPEEDR 寄存器控制，有四个等级：
      - 低速 2MHz（OSPEEDR=00）：适合低 EMI 场景
      - 中速 25MHz（OSPEEDR=01）：通用场景
      - 高速 50MHz（OSPEEDR=10）：较高频率信号
      - 极速 100MHz（OSPEEDR=11）：高速外设如 SPI
      低速与高速 EMI 差异可达 25dB，对信号完整性和 EMC 影响显著。短走线低速即可，高速外设才需要高速度等级。
    reference_chunks:
      - "STM32F4 GPIO 输出速度 OSPEEDR：低速 2MHz、中速 25MHz、高速 50MHz、极速 100MHz。低速与高速 EMI 差异可达 25dB。"
      - "OSPEEDR 寄存器：00=2MHz、01=25MHz、10=50MHz、11=100MHz。选择速度需考虑 EMI 和信号完整性。"
    difficulty: 简单
    category: GPIO
    target_doc: 01-stm32-gpio.md
    tags: [STM32, GPIO, OSPEEDR, 速度, EMI]
    notes: ""

  - id: G003
    question: "STM32 不同系列的 GPIO 时钟使能寄存器有什么差异？配置 GPIO 前必须先做什么？"
    standard_answer: |
      配置 GPIO 前必须先使能对应 GPIO 端口的时钟。不同系列的时钟使能寄存器不同：
      - STM32F4：RCC->AHB1ENR（如 RCC_AHB1ENR_GPIOAEN）
      - STM32L4：RCC->AHB2ENR
      - STM32G0：RCC->IOPENR
      使能后建议空读一次寄存器确保时钟稳定。
    reference_chunks:
      - "STM32F4 GPIO 时钟使能：RCC->AHB1ENR |= RCC_AHB1ENR_GPIOAEN。STM32L4 用 RCC->AHB2ENR，STM32G0 用 RCC->IOPENR。"
      - "配置 GPIO 前必须先使能时钟。STM32F4 用 AHB1ENR，L4 用 AHB2ENR，G0 用 IOPENR。使能后空读确保稳定。"
    difficulty: 中等
    category: GPIO
    target_doc: 01-stm32-gpio.md
    tags: [STM32, GPIO, RCC, 时钟, AHB1ENR]
    notes: "测试跨系列差异"

  - id: G004
    question: "STM32 的外部中断 EXTI 如何配置？EXTI5-9 为什么共享同一个中断向量？"
    standard_answer: |
      EXTI 配置步骤：
      1. 使能 GPIO + SYSCFG 时钟
      2. 配置 GPIO 为输入
      3. SYSCFG_EXTICR 选择端口给 EXTI 线
      4. 配置触发方式（FTSR 下降沿/RTSR 上升沿）
      5. 取消屏蔽（IMR）
      6. 清挂起标志（PR）
      7. 配置 NVIC
      EXTI5-9 共享 EXTI9_5_IRQn 中断向量，EXTI10-15 共享 EXTI15_10_IRQn，因为 ARM Cortex-M 的外部中断向量数量有限，设计上把多个 EXTI 线合并到一个中断入口。
    reference_chunks:
      - "EXTI 配置 7 步：使能 GPIO+SYSCFG 时钟 → 配 GPIO 输入 → SYSCFG_EXTICR 选端口 → 配触发方式(FTSR/RTSR) → 取消屏蔽(IMR) → 清挂起(PR) → 配 NVIC。EXTI5-9 共享 EXTI9_5_IRQn。"
    difficulty: 中等
    category: 中断
    target_doc: 01-stm32-gpio.md
    tags: [STM32, EXTI, 中断, SYSCFG, NVIC]
    notes: ""

  - id: G005
    question: "STM32 GPIO 的锁定机制 LCKR 如何配置？写出 5 步写序列。"
    standard_answer: |
      GPIO 锁定机制用于保护配置不被意外修改（如安全关键场景、Bootloader 保护）。LCKR 的 5 步写序列：
      1. 写 LCKK=1
      2. 写 LCKK=0
      3. 写 LCKK=1
      4. 读 LCKR
      5. 再读 LCKR 确认 LCKK=1（锁定成功）
      锁定后该 GPIO 配置在下次复位前无法修改。
    reference_chunks:
      - "GPIO 锁定机制 LCKR 5 步写序列：LCKK=1 → LCKK=0 → LCKK=1 → 读 LCKR → 再读检查 LCKK。锁定后配置不可修改直到复位。"
    difficulty: 中等
    category: GPIO
    target_doc: 01-stm32-gpio.md
    tags: [STM32, GPIO, LCKR, 锁定, 安全]
    notes: ""

