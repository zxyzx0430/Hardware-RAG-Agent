  - id: G007
    question: "ESP32 的三种 Wi-Fi 省电模式有什么区别？如果应用需要低延迟 TCP 通信应该用哪种？"
    standard_answer: |
      三种省电模式：
      - WIFI_PS_NONE：80-120mA，延迟 <2ms，TCP 性能最佳，适合低延迟通信
      - WIFI_PS_MIN_MODEM：20-40mA，延迟 <50ms，TCP 良好
      - WIFI_PS_MAX_MODEM：5-15mA，延迟 100-500ms，需保活
      低延迟 TCP 通信应选 WIFI_PS_NONE。
    reference_chunks:
      - "ESP32 WiFi 省电模式：WIFI_PS_NONE 80-120mA 延迟<2ms TCP最佳；WIFI_PS_MIN_MODEM 20-40mA 延迟<50ms；WIFI_PS_MAX_MODEM 5-15mA 延迟100-500ms。低延迟 TCP 选 WIFI_PS_NONE。"
    difficulty: 中等
