  - id: G006
    question: "ESP32 Station 模式连接 Wi-Fi 超时怎么办？重连策略应该怎么设计？"
    standard_answer: |
      使用指数退避重连策略：
      - 重试 1-6 次：延迟 2^n 秒（1/2/4/8/16/32 秒）
      - 第 7 次及以后：封顶 60 秒
      - 最大重试次数 MAX_RETRY_COUNT=10
      - 优化：加 0-25% 随机 jitter 避免雪崩，RSSI<-90 跳过重试
      - reason code 15（4WAY_HANDSHAKE_TIMEOUT，密码错误）应停止重试
      - reason code 201（NO_AP_FOUND）可继续重试
    reference_chunks:
      - "ESP32 指数退避重连：重试 1-6 次用 2^n 秒(1/2/4/8/16/32s)，第 7+ 次封顶 60s，MAX_RETRY_COUNT=10。加 jitter 0-25%。reason=15 停止重试，reason=201 可重试。"
      - "WIFI_EVENT_STA_DISCONNECTED reason code：15=4WAY_HANDSHAKE_TIMEOUT(密码错误应停止)，201=NO_AP_FOUND(可重试)，202=AUTH_FAIL。"
    difficulty: 中等
    category: 启动配置
    target_doc: 02-esp32-wifi.md
    tags: [ESP32, WiFi, 指数退避, 重连, reason code]
