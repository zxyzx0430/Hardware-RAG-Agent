[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# A per-test timeout keeps an unresponsive await from wedging the whole run.
# The plugin itself is not named here: with normal autoload that would clash
# with the entry point (ValueError: already registered under a different
# name), and callers that disable autoload pass `-p pytest_timeout` instead.
addopts = --timeout=120 --timeout-method=thread
