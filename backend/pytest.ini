[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Plugin autoload is disabled for determinism, so both plugins are named
# explicitly. The per-test timeout keeps an unresponsive await from wedging
# the whole run; without it a single hung coroutine blocks every later test.
addopts = -p pytest_asyncio.plugin -p pytest_timeout --timeout=120 --timeout-method=thread
